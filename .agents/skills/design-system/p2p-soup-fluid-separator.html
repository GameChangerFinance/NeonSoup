<!-- NeonSoup P2P soup fluid separator reusable markup.
     Include the SVG defs once per page, then add separator sections.
     Load p2p-soup-fluid-separator.css and p2p-soup-fluid-separator.js. -->

<svg class="p2p_soup_fluid_separator_defs" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="p2p_soup_fluid_separator_grad_body" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--ns-accent)"/>
          <stop offset="50%" stop-color="var(--ns-accent-2)"/>
          <stop offset="100%" stop-color="var(--ns-violet)"/>
        </linearGradient>
        <linearGradient id="p2p_soup_fluid_separator_grad_hot" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="var(--ns-accent-2)"/>
          <stop offset="52%" stop-color="var(--ns-violet)"/>
          <stop offset="100%" stop-color="var(--ns-accent)"/>
        </linearGradient>
        <linearGradient id="p2p_soup_fluid_separator_grad_cool" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="var(--ns-violet)"/>
          <stop offset="48%" stop-color="var(--ns-accent)"/>
          <stop offset="100%" stop-color="var(--ns-accent-2)"/>
        </linearGradient>
      </defs>
    </svg>

<!-- Fully expanded approved separator instance from the current landing page. -->
<section class="p2p_soup_fluid_separator" data-p2p-soup-fluid-separator data-direction="ltr" data-variant="a" aria-label="Peer-to-peer soup fluid separator" data-od-id="p2p-soup-fluid-separator-1">
      <div class="p2p_soup_fluid_separator-stage" data-p2p-soup-fluid-separator-stage>
        <div class="p2p_soup_fluid_separator-pot-back p2p_soup_fluid_separator-pot-left" aria-hidden="true">
          <img class="p2p_soup_fluid_separator-pot-img" src="design-system/assets/images/empty_pot_bg.png" alt="">
          <span class="p2p_soup_fluid_separator-pot-glow"></span>
          <span class="p2p_soup_fluid_separator-pot-fluid"></span>
          <span class="p2p_soup_fluid_separator-pot-mouth"></span>
        </div>
        <div class="p2p_soup_fluid_separator-pot-back p2p_soup_fluid_separator-pot-right" aria-hidden="true">
          <img class="p2p_soup_fluid_separator-pot-img" src="design-system/assets/images/empty_pot_bg.png" alt="">
          <span class="p2p_soup_fluid_separator-pot-glow"></span>
          <span class="p2p_soup_fluid_separator-pot-fluid"></span>
          <span class="p2p_soup_fluid_separator-pot-mouth"></span>
        </div>
        <div class="p2p_soup_fluid_separator-track" aria-hidden="true">
          <svg class="p2p_soup_fluid_separator-wave" viewBox="0 0 1200 300" preserveAspectRatio="none" focusable="false">
            <path class="p2p_soup_fluid_separator-wave-body" pathLength="1" d="M 0 164 C 94 78 166 82 244 145 S 398 254 522 160 S 716 50 842 145 S 1040 250 1200 116"/>
            <path class="p2p_soup_fluid_separator-wave-hot" pathLength="1" d="M 0 141 C 114 54 188 76 270 132 S 402 224 544 138 S 730 42 858 126 S 1038 222 1200 96"/>
            <path class="p2p_soup_fluid_separator-wave-cool" pathLength="1" d="M 0 190 C 114 112 190 116 286 170 S 428 278 558 186 S 748 86 878 168 S 1034 276 1200 146"/>
          </svg>
        </div>
        <div class="p2p_soup_fluid_separator-bubble-layer" data-p2p-soup-fluid-separator-bubble-layer aria-hidden="true"></div>
        <div class="p2p_soup_fluid_separator-keyword-layer" data-p2p-soup-fluid-separator-keyword-layer aria-hidden="true">
          <span class="p2p_soup_fluid_separator-keyword" data-p2p-soup-fluid-separator-keyword>peer to peer</span>
        </div>
        <div class="p2p_soup_fluid_separator-payload-layer" data-p2p-soup-fluid-separator-payload-layer aria-hidden="true"></div>
        <div class="p2p_soup_fluid_separator-pot-front p2p_soup_fluid_separator-pot-left" aria-hidden="true">
          <img class="p2p_soup_fluid_separator-pot-img" src="design-system/assets/images/empty_pot_fg.png" alt="">
        </div>
        <div class="p2p_soup_fluid_separator-pot-front p2p_soup_fluid_separator-pot-right" aria-hidden="true">
          <img class="p2p_soup_fluid_separator-pot-img" src="design-system/assets/images/empty_pot_fg.png" alt="">
        </div>
      </div>
    </section>

<!-- Minimal generated instance. The JS will create the stage internals. -->
<section class="p2p_soup_fluid_separator" data-p2p-soup-fluid-separator data-direction="rtl" data-variant="b" data-screen-label="P2P Soup Separator">
  <span data-p2p-soup-fluid-separator-keyword>no middlemen</span>
</section>
